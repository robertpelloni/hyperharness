name: HyperHarness Go CI

on:
  push:
    branches: [ "main", "develop", "jules-*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: "1.24"

    - name: Ensure Dependencies
      run: go mod tidy

    - name: Build
      run: go build -v ./...

    - name: Run Unit Tests
      run: go test -v -race ./...

    - name: Run E2E Integration Tests
      run: go test -v ./agent/... -run TestHarnessE2E
